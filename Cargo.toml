[package]
name = "righttype"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Fix wrong-keyboard-layout Thai/English typing — a modern, safe Rust successor to RightLang"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/k-affan-th/RightType"
keywords = ["keyboard", "thai", "layout", "rightlang", "windows"]
categories = ["text-processing"]

# Pure-logic core lives in the library so it is unit-testable with no OS calls.
[lib]
name = "righttype"
path = "src/lib.rs"

# The Windows tray application.
[[bin]]
name = "righttype"
path = "src/main.rs"

[dependencies]
zeroize = "1"

# --- Windows-only integration layer ---
# Enabled incrementally as the OS layer is built (hook/inject/session/safety/ui).
# Re-enable by adding `winos` to the default features, or build with
# `--features winos`.
[features]
default = []
winos = [
    "dep:crossbeam-channel",
    "dep:once_cell",
    "dep:serde",
    "dep:toml",
    "dep:native-windows-gui",
    "dep:native-windows-derive",
    "dep:windows",
]

[target.'cfg(windows)'.dependencies]
crossbeam-channel = { version = "0.5", optional = true }
once_cell = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }
native-windows-gui = { version = "1.0.13", optional = true }
native-windows-derive = { version = "1.0.5", optional = true }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
optional = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_ErrorReporting",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
]

[dev-dependencies]

# Small, fast, secret-safe binary (see plan: ~2–5 MB target).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
