<!doctype html>
<html lang="th"><head><meta charset="utf-8"><title>RightType</title>
<link rel="icon" type="image/png" href="../img/icon.png">
<link rel="icon" type="image/x-icon" href="icon.ico">
<style>
@font-face{font-family:Noto;font-weight:100 900;src:url(fonts/noto-sans-thai-thai-wght-normal.woff2) format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:Noto;font-weight:100 900;src:url(fonts/noto-sans-thai-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--bg:#f6f5f1;--ink:#14181f;--mute:#667085;--acc:#3f6fd1;--line:#dedbd2}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;background:var(--bg);color:var(--ink);font-family:Noto,sans-serif;overflow:hidden;position:relative}
.brand{position:absolute;left:90px;top:64px;display:flex;align-items:center;gap:14px;font-size:27px;font-weight:800;z-index:3}
.brand img{width:40px;height:40px}
.rust{position:absolute;right:90px;top:62px;font-size:21px;font-weight:800;border:2px solid var(--ink);border-radius:99px;padding:2px 16px;z-index:3}
.t{position:absolute;white-space:nowrap;line-height:1}
.t1{left:70px;top:190px;font-size:300px;font-weight:900;letter-spacing:-13px}
.t2{left:76px;top:412px;font-size:185px;font-weight:100;letter-spacing:-6px}
.t3{left:566px;top:506px;font-size:114px;font-weight:900;letter-spacing:-5px;color:var(--acc);z-index:2}
#gl{position:absolute;left:0;top:624px;width:1080px;height:270px;mix-blend-mode:multiply;z-index:1}
.lead{position:absolute;left:742px;top:272px;width:250px;line-height:1.5;font-size:27px;font-weight:300;color:var(--mute);z-index:3}
.lead b{color:var(--ink);font-weight:800}
.why{position:absolute;left:90px;right:90px;top:942px}
.why h2{font-size:21px;font-weight:800;letter-spacing:.5px;color:var(--acc);border-bottom:2px solid var(--ink);padding-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 26px;margin-top:26px}
.grid svg{display:block;width:43px;height:43px;fill:none;stroke:var(--acc);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:14px}
.grid b{display:block;font-size:27px;font-weight:900;line-height:1.2;letter-spacing:-.5px;white-space:nowrap}
.grid span{display:block;font-size:21px;font-weight:300;line-height:1.4;color:var(--mute);margin-top:4px;white-space:nowrap}
.foot{position:absolute;left:90px;right:90px;bottom:44px;display:flex;align-items:center;gap:28px}
.qr{position:relative;width:113px;height:113px;flex:none}
.qr>img{width:100%;height:100%;display:block}
.qr .logo{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;background:#fff;border-radius:8px;padding:5px;box-shadow:0 0 0 3px #fff}
.qr .logo svg{width:100%;height:100%;display:block}
.foot b{display:block;font-size:43px;font-weight:900;line-height:1.1;letter-spacing:-1px}
.foot span{display:block;font-size:23px;font-weight:300;color:var(--mute);margin-top:4px;font-family:Consolas,monospace}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
 <div class="brand"><img src="icon.ico">RightType</div><div class="rust">Rust</div>
 <div class="t t1">พิมพ์</div>
 <div class="t t2">ผิดภาษา</div>
 <div class="t t3">แก้ให้เอง</div>
 <p class="lead">แก้คำที่พิมพ์ผิดคีย์บอร์ด <nobr><b>ไทย ↔ อังกฤษ</b></nobr> ให้ทันที</p>
 <canvas id="gl" width="1080" height="270"></canvas>
 <div class="why">
  <h2>ต่างจากตัวอื่นตรงไหน</h2>
  <div class="grid">
   <div><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M8 15h8"/><path d="M9 10h.01M12 10h.01M15 10h.01"/></svg><b>ไม่ย้ำปุ่ม</b><span>ฉีด Unicode ทีเดียว</span></div>
   <div><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><b>ตื่นแล้วทำต่อ</b><span>หลังเครื่องหลับ</span></div>
   <div><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg><b>ไม่แก้คำถูกให้ผิด</b><span>แปลงผิด 0 ในชุดทดสอบ</span></div>
   <div><svg viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M3 3l18 18"/></svg><b>ไม่ออกเน็ต</b><span>ไม่มีโค้ดเครือข่าย</span></div>
  </div>
 </div>
 <div class="foot">
  <div class="qr"><img src="qr.svg" alt="QR"><div class="logo"><svg viewBox="0 0 16 16"><path fill="#14181f" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></div></div>
  <div><b>ฟรี สแกนแล้วลองเลย</b><span>github.com/k-affan-th/RightType</span></div>
 </div>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
const STATIC=new URLSearchParams(location.search).has('static');
const W=1080,H=270,PX=2;
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const rt=new THREE.WebGLRenderTarget(W,H,{samples:4});
const scene=new THREE.Scene();scene.background=new THREE.Color(0xffffff);
const cam=new THREE.PerspectiveCamera(13.1,W/H,0.1,100);cam.position.set(0.7,8.9,8.4);cam.lookAt(0,-0.1,0);
scene.add(new THREE.AmbientLight(0xffffff,0.6));
const sun=new THREE.DirectionalLight(0xffffff,1.9);sun.position.set(-3,10,4);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9});sun.shadow.radius=4;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.ShadowMaterial({opacity:0.5}));
ground.rotation.x=-Math.PI/2;ground.position.y=-0.3;ground.receiveShadow=true;scene.add(ground);
await document.fonts.load('800 200px Noto','แcพ');
function legend(ch,font,color){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle=color;g.font=font;g.textAlign='center';g.textBaseline='middle';g.fillText(ch,128,150);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;
}
function key(ch,dark){
  const grp=new THREE.Group();
  const body=new THREE.Mesh(new RoundedBoxGeometry(1,0.55,1,6,0.14),new THREE.MeshStandardMaterial({color:dark?0x1a1a1a:0xe4e4e4,roughness:0.6}));
  body.castShadow=true;body.receiveShadow=true;grp.add(body);
  const top=new THREE.Mesh(new THREE.PlaneGeometry(0.92,0.92),new THREE.MeshBasicMaterial({map:legend(ch,/[ก-๛]/.test(ch)?'800 215px Noto':'800 200px Noto',dark?'#fff':'#000'),transparent:true}));
  top.rotation.x=-Math.PI/2;top.position.y=0.3;grp.add(top);
  return grp;
}
const TH=['แ','น','พ','พ','ำ','แ','ะ'],EN=['C','O','R','R','E','C','T'];
const step=1.12,x0=-3*step;
const thai=TH.map((c,i)=>{const k=key(c,false);k.position.set(x0+i*step,0,-1.05);scene.add(k);return k;});
const eng=EN.map((c,i)=>{const k=key(c,true);k.position.set(x0+i*step,0.5,0.85);scene.add(k);return k;});
const post=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({
  uniforms:{t:{value:rt.texture},res:{value:new THREE.Vector2(W,H)},px:{value:PX},
    ink:{value:new THREE.Vector3(0x3f/255,0x6f/255,0xd1/255)},paper:{value:new THREE.Vector3(1,1,1)}},
  vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader:`precision highp float;varying vec2 v;uniform sampler2D t;uniform vec2 res;uniform float px;uniform vec3 ink,paper;
  float bayer(vec2 p){vec2 q=mod(p,8.);float s=0.;
    for(int i=0;i<3;i++){vec2 b=mod(floor(q/pow(2.,float(2-i))),2.);
      float d=(b.x==0.&&b.y==0.)?0.:(b.x==1.&&b.y==1.)?1.:(b.x==1.&&b.y==0.)?2.:3.;s=s*4.+d;}
    return (s+.5)/64.;}
  void main(){vec2 cell=floor(v*res/px);vec2 uv=(cell+.5)*px/res;
    vec3 c=texture2D(t,uv).rgb;float l=pow(dot(c,vec3(.299,.587,.114)),1./2.2);
    float k=step(bayer(cell),l*1.02);gl_FragColor=vec4(mix(ink,paper,k),1.);}`,
  depthTest:false}));
const pscene=new THREE.Scene();pscene.add(post);const pcam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
function frame(t){
  eng.forEach((k,i)=>{const p=ease((t-i*0.12)/0.7);k.position.y=0.5+(1-p)*-0.5+Math.sin(t*1.4+i*0.5)*0.04*p;});
  thai.forEach((k,i)=>{k.position.y=Math.sin(t*1.4+i*0.5+2)*0.025;});
  renderer.setRenderTarget(rt);renderer.render(scene,cam);
  renderer.setRenderTarget(null);renderer.render(pscene,pcam);
}
if(STATIC){frame(3);window.__ready=true;}
else{(function loop(ms){frame((ms/1000)%6);requestAnimationFrame(loop)})(0);}
</script></body></html>
